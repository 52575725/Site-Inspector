<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Site Inspector{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <span class="brand-icon">&#128269;</span>
            <span>Site Inspector</span>
        </div>
        <nav class="sidebar-nav">
            <a href="/" class="nav-item {% if request.url.path == '/' %}active{% endif %}">
                &#9632; Dashboard
            </a>
            <a href="/issues" class="nav-item {% if request.url.path.startswith('/issues') %}active{% endif %}">
                &#9888; Issues
            </a>
            <a href="/fixes" class="nav-item {% if request.url.path.startswith('/fixes') %}active{% endif %}">
                &#9874; Fixes
            </a>
            <a href="/articles" class="nav-item {% if request.url.path.startswith('/articles') %}active{% endif %}">
                &#9997; AI Articles
            </a>
            <a href="/tools" class="nav-item {% if request.url.path.startswith('/tools') %}active{% endif %}">
                &#128295; Tools
            </a>
            <a href="/scans" class="nav-item {% if request.url.path.startswith('/scans') %}active{% endif %}">
                &#128260; Scans
            </a>
        </nav>
    </aside>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
